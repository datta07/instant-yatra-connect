<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instant Yatra - Connect Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid #E2E8F0;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 18px;
      box-shadow: 0 8px 20px -4px rgba(30, 64, 175, 0.35);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .user-box {
      background: #F1F5F9;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
      border: 1px solid #E2E8F0;
    }
    .user-box .label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748B;
      margin-bottom: 4px;
    }
    .user-box .val {
      font-size: 16px;
      font-weight: 700;
      color: #1E40AF;
      word-break: break-all;
    }
    .user-box .subtext {
      font-size: 11px;
      color: #059669;
      font-weight: 600;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #1E40AF;
      color: #FFFFFF;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(30, 64, 175, 0.28);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background: #1E3A8A;
    }
    .badge-copied {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 12px;
      font-size: 13px;
      color: #065F46;
      font-weight: 600;
      line-height: 1.4;
    }
    .fallback-note {
      margin-top: 20px;
      font-size: 12px;
      color: #94A3B8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">🚆</div>
    <h1>Instant Yatra Alerts</h1>
    <p class="subtitle">Get notified the second a confirmed train seat opens up for you!</p>

    <div class="user-box">
      <div class="label">Connecting to:</div>
      <div class="val" id="userName">Detecting...</div>
      <div class="subtext">🔒 Private alerts sent only to you</div>
    </div>

    <button id="connectBtn" class="btn">👉 Tap to Connect (1-Tap)</button>

    <div id="copiedBadge" class="badge-copied">
      🎉 <b>You're all set!</b><br>
      Switch back to Instant Yatra app to see your seat alerts.
    </div>

    <p class="fallback-note">100% Free • No spam • Direct alerts</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const user = tg?.initDataUnsafe?.user;
    let chatId = user?.id || "";
    let firstName = user?.first_name || "Traveler";
    let username = user?.username ? `@${user.username}` : "";

    const userNameEl = document.getElementById("userName");
    const connectBtn = document.getElementById("connectBtn");
    const copiedBadge = document.getElementById("copiedBadge");

    if (chatId) {
      userNameEl.innerText = `${firstName} ${username}`.trim();
    } else {
      userNameEl.innerText = "Telegram User";
    }

    connectBtn.addEventListener("click", async () => {
      if (!chatId) {
        alert("Please open this page inside Telegram to connect.");
        return;
      }

      // Copy to clipboard
      try {
        await navigator.clipboard.writeText(String(chatId));
      } catch (e) {
        console.error("Clipboard copy failed:", e);
      }

      copiedBadge.style.display = "block";
      connectBtn.innerText = "✅ CONNECTED! GO TO APP";
      connectBtn.style.background = "#059669";

      // Smoothly close the Mini-App after 1.2s
      setTimeout(() => {
        if (tg && tg.close) {
          tg.close();
        }
      }, 1200);
    });
  </script>
</body>
</html>
