<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Instant Yatra...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F8FAFC;
      color: #0F172A;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #E2E8F0;
      max-width: 340px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DBEAFE;
      border-top-color: #1E40AF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #1E40AF;
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Switching to Instant Yatra...</h2>
    <p>Opening your app to finish connecting seat alerts.</p>
    <a id="openBtn" class="btn" href="#">👉 Open Instant Yatra</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const chatId = params.get('chat_id') || '';
    const name = params.get('name') || '';

    if (chatId) {
      const deepLink = `instantyatra://telegram?chat_id=${chatId}&name=${encodeURIComponent(name)}`;
      const intentLink = `intent://telegram?chat_id=${chatId}&name=${encodeURIComponent(name)}#Intent;scheme=instantyatra;package=com.garudadev.instant_yatra;end`;

      const btn = document.getElementById('openBtn');
      btn.href = deepLink;

      // Attempt automatic redirect
      window.location.href = deepLink;

      setTimeout(() => {
        window.location.href = intentLink;
      }, 500);
    }
  </script>
</body>
</html>
